
# Paribus Hospital Bulk Processing System
# Render Blueprint
#
# Architecture:
#   FastAPI Web Service --> PostgreSQL <-- Background Worker
#                                             |
#                                             v
#                                      Hospital Directory API

databases:
  - name: paribus-bulk-db
    databaseName: paribus_bulk
    user: paribus_bulk
    plan: free
    region: singapore

services:

  # ============================================================
  # SERVICE 1: FastAPI Web Application
  # ============================================================
  - type: web
    name: paribus-bulk-api
    runtime: docker
    plan: free
    region: singapore

    dockerfilePath: ./Dockerfile
    dockerContext: .

    # IMPORTANT:
    # Do not set dockerCommand here.
    # The Dockerfile CMD runs:
    #   1. python -m alembic upgrade head
    #   2. uvicorn app.main:app
    #
    # Web services must listen on an HTTP port.

    healthCheckPath: /openapi.json

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paribus-bulk-db
          property: connectionString

      - key: UPSTREAM_BASE_URL
        value: https://hospital-directory.onrender.com

      - key: ENABLE_REAL_UPSTREAM_WRITES
        value: "false"

      - key: ADMIN_API_KEY
        sync: false

      - key: PYTHONUNBUFFERED
        value: "1"

  # ============================================================
  # SERVICE 2: Dedicated Background Worker
  # ============================================================
  - type: worker
    name: paribus-bulk-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore

    dockerfilePath: ./Dockerfile
    dockerContext: .

    numInstances: 1

    # Override the Dockerfile's API command.
    # This process polls PostgreSQL and processes queued batches.
    # It does NOT listen on an HTTP port.
    dockerCommand: python -m scripts.run_worker --execute

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paribus-bulk-db
          property: connectionString

      - key: UPSTREAM_BASE_URL
        value: https://hospital-directory.onrender.com

      # WARNING:
      # Enables real hospital creation and activation.
      # Secure the public upload endpoint before deployment.
      - key: ENABLE_REAL_UPSTREAM_WRITES
        value: "true"

      - key: WORKER_POLL_SECONDS
        value: "2"

      - key: PYTHONUNBUFFERED
        value: "1"
