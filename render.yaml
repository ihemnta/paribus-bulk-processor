# Stage 1: PostgreSQL and FastAPI only.
# Add the dedicated background worker after deployment verification.

databases:
  - name: paribus-bulk-db
    databaseName: paribus_bulk
    user: paribus_bulk
    plan: free
    region: singapore

services:
  - type: web
    name: paribus-bulk-api
    runtime: docker
    plan: free
    region: singapore

    dockerfilePath: ./Dockerfile
    dockerContext: .

    dockerCommand: python -m scripts.run_worker --execute
    numInstances: 1

    healthCheckPath: /openapi.json

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paribus-bulk-db
          property: connectionString

      - key: ENABLE_REAL_UPSTREAM_WRITES
        value: "true"

      - key: UPSTREAM_BASE_URL
        value: https://hospital-directory.onrender.com

      - key: ADMIN_API_KEY
        sync: false
      
      - key: WORKER_POLL_SECONDS
        value: "2"