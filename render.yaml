# Paribus Hospital Bulk Processing System
# Single Render Blueprint: PostgreSQL + HTTP API + dedicated worker.
# The API must listen on an HTTP port; the worker must not replace the API.

databases:
  - name: paribus-bulk-db
    databaseName: paribus_bulk
    user: paribus_bulk
    plan: free
    region: singapore

services:
  # Public FastAPI web service (free).
  - type: web
    name: paribus-bulk-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Runs Alembic migrations and then starts Uvicorn on $PORT.
    # Requires app/start_api.py to be committed to this repository.
    dockerCommand: "python -m app.start_api"
    healthCheckPath: /openapi.json

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paribus-bulk-db
          property: connectionString
      - key: UPSTREAM_BASE_URL
        value: https://hospital-directory.onrender.com
      - key: ENABLE_REAL_UPSTREAM_WRITES
        value: "false"
      - key: ADMIN_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

  # Dedicated background worker (paid). Does not listen on an HTTP port.
  - type: worker
    name: paribus-bulk-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1

    dockerCommand: "python -m scripts.run_worker --execute"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paribus-bulk-db
          property: connectionString
      - key: UPSTREAM_BASE_URL
        value: https://hospital-directory.onrender.com

      # CAUTION: This worker will create/activate real upstream hospitals
      # for queued batches as soon as it starts. Secure uploads and review
      # the existing queue before syncing this paid service.
      - key: ENABLE_REAL_UPSTREAM_WRITES
        value: "true"
      - key: WORKER_POLL_SECONDS
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
