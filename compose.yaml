services:
  db:
    image: postgres:16-alpine
    container_name: paribus-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: paribus
      POSTGRES_PASSWORD: paribus_dev_password
      POSTGRES_DB: paribus_bulk

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U paribus -d paribus_bulk
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: